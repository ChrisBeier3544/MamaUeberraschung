<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Testzentrale Adventskalender</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f4efe4; --card: #fffdf7; --ink: #23302a; --soft: #6b6457; --line: #e4dccb; --pine: #1f3d33; --gold: #c9a04a; --wine: #8e2d3b; --night: #22324a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 "DM Sans", Arial, sans-serif; }
    button, input { font: inherit; }
    .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; height: 100dvh; }
    .panel { display: flex; flex-direction: column; min-height: 0; background: var(--card); border-right: 1px solid var(--line); }
    header { padding: 14px 16px 0; }
    h1 { margin: 0 0 10px; font: 600 22px Fraunces, Georgia, serif; color: var(--pine); }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
    .tab { flex: 1; border: none; background: none; padding: 10px 4px 9px; font-weight: 700; font-size: 14px; color: var(--soft); border-bottom: 3px solid transparent; cursor: pointer; }
    .tab.on { color: var(--pine); border-color: var(--gold); }
    .body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
    .page { display: none; flex-direction: column; gap: 12px; }
    .page.on { display: flex; }
    .note { margin: 0; font-size: 12.5px; color: var(--soft); }
    .opt { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
    .opt input { width: 18px; height: 18px; accent-color: var(--pine); }
    /* Szenen-Liste */
    .scenes { display: flex; flex-direction: column; gap: 6px; }
    .row { display: grid; grid-template-columns: 46px 1fr 1fr; gap: 6px; align-items: stretch; }
    .row .d { display: grid; place-items: center; font: 600 15px Fraunces, Georgia, serif; color: var(--pine); background: #f2ede0; border-radius: 10px; }
    .sc { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 9px; cursor: pointer; display: flex; gap: 7px; align-items: center; min-height: 46px; color: var(--ink); }
    .sc:hover { border-color: var(--gold); }
    .sc i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; }
    .sc.m i { background: #fff3cf; color: #b07a12; }
    .sc.e i { background: var(--night); color: #f3dc93; }
    .sc b { font-size: 13px; line-height: 1.2; font-weight: 600; }
    .sc.on { background: var(--pine); border-color: var(--pine); color: #fff6e0; }
    .sc.on.m i { background: #f3dc93; } .sc.on.e i { background: #0f1b2b; }
    .sc.done:not(.on) { box-shadow: inset 3px 0 0 var(--gold); }
    /* Tage */
    .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .days .wd { text-align: center; font-size: 10.5px; color: #a49b88; font-weight: 700; }
    .day { height: 40px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; position: relative; padding: 0; }
    .day:hover { border-color: var(--gold); }
    .day.sp::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--wine); }
    .day.on { background: var(--pine); color: #fff6e0; border-color: var(--pine); }
    .day.x { visibility: hidden; }
    .month { font-weight: 700; font-size: 12.5px; color: var(--soft); margin: 6px 0 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .chip.on { background: var(--pine); color: #fff6e0; border-color: var(--pine); }
    .ev { display: grid; grid-template-columns: 1fr; gap: 5px; }
    .ev button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 13.5px; }
    .ev button small { color: var(--soft); margin-right: 6px; font-weight: 700; }
    .ev button:hover { border-color: var(--gold); }
    h3 { margin: 4px 0 0; font: 700 11.5px "DM Sans"; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    /* Spielstand */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stats div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; }
    .stats b { display: block; font: 600 18px Fraunces, Georgia, serif; color: var(--pine); }
    .stats span { font-size: 11px; color: var(--soft); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: #fff; font-weight: 600; cursor: pointer; font-size: 13.5px; color: var(--ink); }
    .btn:hover { border-color: var(--gold); }
    .btn.warn { background: var(--wine); color: #fff; border-color: var(--wine); }
    /* Vorschau */
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: radial-gradient(circle at 50% 30%, #e9e2d2, #d9cfba); }
    .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(255, 253, 247, .9); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .now { font: 600 16px Fraunces, Georgia, serif; color: var(--pine); white-space: nowrap; }
    .bar .grow { flex: 1; }
    .bar .big { background: var(--pine); color: #fff6e0; border-color: var(--pine); }
    .bar a { color: var(--pine); font-weight: 600; font-size: 13px; }
    .viewport { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px; overflow: hidden; }
    .device { position: relative; background: #111; border-radius: 40px; padding: 11px; box-shadow: 0 30px 60px rgba(0, 0, 0, .3); flex: none; }
    .device.desk { border-radius: 14px; padding: 22px 8px 8px; background: #2b2b2e; }
    .device iframe { display: block; border: 0; border-radius: 30px; background: #fff; }
    .device.desk iframe { border-radius: 6px; }
    .loading { position: absolute; inset: 11px; border-radius: 30px; background: rgba(31, 61, 51, .55); color: #fff6e0; display: grid; place-items: center; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .device.busy .loading { opacity: 1; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
      .stage { order: -1; height: 72vh; }
      .panel { border-right: none; }
      .body { overflow: visible; }
      #devices, #openTab { display: none; }
      .tab { font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <h1>Testzentrale</h1>
      <div class="tabs">
        <button class="tab on" data-p="scenes">Munkel-Szenen</button>
        <button class="tab" data-p="days">Tage</button>
        <button class="tab" data-p="state">Spielstand</button>
      </div>
    </header>
    <div class="body">
      <!-- Szenen -->
      <section class="page on" id="p-scenes">
        <p class="note">Eine Szene antippen – sie startet sofort. Das Schloss hat dabei die Sammelstücke, die Mama bis zu diesem Tag hätte.</p>
        <label class="opt"><input type="checkbox" id="late"> Nach 21 Uhr testen (Abendszenen enden mit Einschlafen)</label>
        <div class="scenes" id="scenes"></div>
      </section>
      <!-- Tage -->
      <section class="page" id="p-days">
        <h3>Uhrzeit</h3>
        <div class="chips" id="times"></div>
        <h3>Tag</h3>
        <div id="cal"></div>
        <h3>Besondere Momente</h3>
        <div class="ev" id="events"></div>
      </section>
      <!-- Spielstand -->
      <section class="page" id="p-state">
        <div class="stats" id="stats"><div><b>–</b><span>Taler</span></div><div><b>–</b><span>Rätsel</span></div><div><b>–</b><span>Tiere</span></div><div><b>–</b><span>Szenen</span></div></div>
        <div class="grid2">
          <button class="btn" data-act="coins">+100 Taler</button>
          <button class="btn" data-act="solve">Rätsel bis gestern lösen</button>
          <button class="btn" data-act="animals">+10 Tiere finden</button>
          <button class="btn" data-act="buyall">Alles im Shop kaufen</button>
          <button class="btn" data-act="intro">Erster Besuch nochmal</button>
          <button class="btn warn" data-act="reset">Spielstand löschen</button>
        </div>
        <p class="note">Der Testspielstand ist getrennt – Mamas echter Spielstand bleibt unberührt.</p>
      </section>
    </div>
  </aside>

  <main class="stage">
    <div class="bar">
      <button class="btn" id="prev" title="Zurück (←)">◀</button>
      <span class="now" id="now">–</span>
      <button class="btn" id="next" title="Weiter (→)">▶</button>
      <button class="btn big" id="replay" title="Szene nochmal (R)">↻ Nochmal</button>
      <span class="grow"></span>
      <span class="chips" id="devices"></span>
      <a id="openTab" href="#" target="_blank" rel="noopener">Neuer Tab ↗</a>
    </div>
    <div class="viewport" id="vp"><div class="device" id="device"><iframe id="frame" title="Vorschau"></iframe><div class="loading">Lädt …</div></div></div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const p2 = (n) => String(n).padStart(2, "0");
  const T = "test:";
  const SCENES = [
    ["14m", "Aufwachen"], ["14e", "Einnicken im Nest"], ["15m", "Postflug"], ["15e", "Sterne anknipsen"], ["16m", "Frühstück"], ["16e", "Gute-Nacht-Lied"],
    ["17m", "Durchs Schlüsselloch"], ["17e", "Schneeflocken fangen"], ["18m", "Morgensport"], ["18e", "Schal stricken"], ["19m", "Schlüssel knacken"], ["19e", "Laterne & Glühwürmchen"],
    ["20m", "Seifenblasen"], ["20e", "Sternschnuppe"], ["21m", "Mützen-Anprobe"], ["21e", "Besuch der Eule"], ["22m", "Mini-Schneemann"], ["22e", "Kerze anzünden"],
    ["23m", "Wurm-Tauziehen"], ["23e", "Polarlicht"], ["24m", "Federputz-Show"], ["24e", "Mond-Schaukel"], ["25m", "Looping-Ausflug"], ["25e", "Lichterkette"],
    ["26m", "Schloss polieren"], ["26e", "Schattenspiel"], ["27m", "Aufregung"], ["27e", "Schäfchen zählen"],
  ];
  // was nach welcher Szene am Schloss liegt
  const GAINS = { "14e": ["nest"], "15m": ["brief"], "18m": ["slim"], "19e": ["laterne"], "21m": ["hat"], "22m": ["schneemann"], "22e": ["kerze"], "25e": ["lichter"], "26m": ["glanz"] };
  const SPECIAL = { "2026-11-27": "Schloss zu", "2026-11-28": "Schloss öffnet", "2026-11-29": "1. Advent", "2026-12-01": "Erstes Türchen", "2026-12-06": "Nikolaus", "2026-12-13": "Neue Tiere", "2026-12-17": "Nachwuchs", "2026-12-18": "Bonus-Paket", "2026-12-19": "Erster Schnee", "2026-12-20": "Neue Tiere", "2026-12-23": "Weihnachtsfoto", "2026-12-24": "Heiligabend", "2026-12-31": "Silvester" };
  const EVENTS = [
    ["2026-11-28", "08:59", "Eine Minute vor dem Öffnen"], ["2026-11-28", "09:30", "Erster Besuch: Aufschließen, Brief, Erklärung", 1],
    ["2026-11-29", "10:00", "Vorgeschmack: höchstens 7 Tiere"], ["2026-12-01", "09:00", "Erstes Türchen"], ["2026-12-06", "10:00", "Nikolaus"],
    ["2026-12-18", "10:00", "Bonus-Paket"], ["2026-12-23", "11:00", "Weihnachtsfoto"], ["2026-12-24", "18:00", "Heiligabend"],
    ["2026-12-31", "22:00", "Silvester & Abspann"], ["2027-01-02", "11:00", "Nach Silvester"],
  ];
  const TIMES = [["08:00", "Früh"], ["09:30", "Morgen"], ["13:00", "Mittag"], ["18:00", "Abend"], ["21:30", "Nacht"]];
  const DEVICES = { phone: ["Samsung", 360, 780], iphone: ["iPhone", 390, 844], desk: ["Computer", 1366, 860] };

  let cfg = { date: "2026-11-14", time: "09:30", device: "phone", scene: null, late: false };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem("testzentrale2") || "{}")); } catch (e) {}
  const store = () => { try { localStorage.setItem("testzentrale2", JSON.stringify(cfg)); } catch (e) {} };

  const frame = $("frame"), device = $("device"), vp = $("vp");
  const G = (name) => { try { return frame.contentWindow.eval(`typeof ${name} !== "undefined" ? ${name} : null`); } catch (e) { return null; } };
  let afterLoad = null;
  frame.addEventListener("load", () => {
    device.classList.remove("busy");
    try { frame.contentWindow.document.addEventListener("keydown", onKey); } catch (e) {}
    setTimeout(stats, 1000);
    if (afterLoad) { const f = afterLoad; afterLoad = null; setTimeout(f, 700); }
  });
  function load(fresh, then) {
    store(); render();
    afterLoad = then || null; device.classList.add("busy");
    frame.src = `index.html?t=${Date.now()}#test-${cfg.date}-${cfg.time.replace(":", "")}${fresh ? "-leer" : ""}`;
    $("openTab").href = `index.html#test-${cfg.date}-${cfg.time.replace(":", "")}`;
  }

  /* ---------- Szenen ---------- */
  function playScene(id) {
    const i = SCENES.findIndex((s) => s[0] === id); if (i < 0) return;
    cfg.scene = id; cfg.date = `2026-11-${id.slice(0, 2)}`;
    cfg.time = id.endsWith("m") ? "09:30" : cfg.late ? "21:30" : "19:30";
    // Stand wie an diesem Tag: alles, was vor dieser Szene passiert ist
    const items = [], seen = {}; let slim = false, hat = null;
    SCENES.forEach(([s], k) => { seen[s] = 1; if (k < i) (GAINS[s] || []).forEach((g) => { if (g === "slim") slim = true; else if (g === "hat") hat = "bommel"; else items.push(g); }); });
    try { localStorage.setItem(T + "mama-munkel-2026", JSON.stringify({ seen, items, hat, slim, sky: null })); } catch (e) {}
    load(false, () => { const M = G("MunkelShow"); if (M) M.play(id); });
  }
  function buildScenes() {
    const box = $("scenes");
    for (let d = 14; d <= 27; d++) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<div class="d">${d}.</div>`;
      ["m", "e"].forEach((p) => {
        const id = `${d}${p}`, t = SCENES.find((s) => s[0] === id)[1];
        const b = document.createElement("button"); b.className = `sc ${p}`; b.dataset.id = id;
        b.innerHTML = `<i>${p === "m" ? "☀" : "☾"}</i><b>${t}</b>`;
        b.onclick = () => playScene(id);
        row.append(b);
      });
      box.append(row);
    }
    $("late").checked = cfg.late;
    $("late").onchange = (e) => { cfg.late = e.target.checked; store(); if (cfg.scene && cfg.scene.endsWith("e")) playScene(cfg.scene); };
  }

  /* ---------- Tage ---------- */
  function buildDays() {
    const t = $("times");
    TIMES.forEach(([v, n]) => { const b = document.createElement("button"); b.className = "chip"; b.dataset.t = v; b.textContent = `${n} ${v}`; b.onclick = () => { cfg.time = v; cfg.scene = null; load(); }; t.append(b); });
    const cal = $("cal");
    [[2026, 10, 13], [2026, 11, 1], [2027, 0, 1]].forEach(([y, m, from]) => {
      const last = m === 0 ? 3 : new Date(y, m + 1, 0).getDate();
      cal.insertAdjacentHTML("beforeend", `<div class="month">${new Date(y, m, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</div>`);
      const g = document.createElement("div"); g.className = "days";
      ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach((w) => g.insertAdjacentHTML("beforeend", `<div class="wd">${w}</div>`));
      for (let i = 0; i < (new Date(y, m, from).getDay() + 6) % 7; i++) g.insertAdjacentHTML("beforeend", `<button class="day x"></button>`);
      for (let d = from; d <= last; d++) {
        const k = `${y}-${p2(m + 1)}-${p2(d)}`;
        const b = document.createElement("button"); b.className = "day" + (SPECIAL[k] ? " sp" : ""); b.dataset.d = k; b.textContent = d; b.title = SPECIAL[k] || "";
        b.onclick = () => { cfg.date = k; cfg.scene = null; load(); };
        g.append(b);
      }
      cal.append(g);
    });
    const ev = $("events");
    EVENTS.forEach(([d, t2, label, fresh]) => {
      const b = document.createElement("button");
      b.innerHTML = `<small>${new Date(d + "T12:00").toLocaleDateString("de-DE", { day: "numeric", month: "numeric" })} ${t2}</small>${label}`;
      b.onclick = () => { cfg.date = d; cfg.time = t2; cfg.scene = null; if (fresh) clearFirst(); load(); };
      ev.append(b);
    });
  }

  /* ---------- Spielstand ---------- */
  function clearFirst() { ["mama-intro-2026", "mama-aufgeschlossen-2026"].forEach((k) => localStorage.removeItem(T + k)); try { const z = JSON.parse(localStorage.getItem(T + "mama-zoo-2026") || "{}"); delete z.startGift; localStorage.setItem(T + "mama-zoo-2026", JSON.stringify(z)); } catch (e) {} }
  function stats() {
    const j = (k, d) => { try { return JSON.parse(localStorage.getItem(T + k) || d); } catch (e) { return JSON.parse(d); } };
    const c = $("stats").querySelectorAll("b");
    c[0].textContent = j("mama-zoo-2026", "{}").coins || 0;
    c[1].textContent = Object.keys(j("mama-advent-2026", "{}").solved || {}).length;
    c[2].textContent = j("mama-gehege-2026", "[]").length;
    c[3].textContent = Object.keys(j("mama-munkel-2026", "{}").seen || {}).length;
  }
  document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
    const a = b.dataset.act, w = frame.contentWindow, Zoo = G("Zoo"), App = G("App"), Animals = G("Animals");
    try {
      if (a === "coins") { if (!Zoo) throw 0; Zoo.addCoins(100); setTimeout(stats, 300); }
      if (a === "solve") { if (!App) throw 0; const td = new w.Date(); for (let d = 1; d <= 31; d++) if (new w.Date(2026, 11, d) < new w.Date(td.getFullYear(), td.getMonth(), td.getDate()) && !App.isSolved(d)) { App.markSolved(d); if (Zoo) Zoo.addCoins(Zoo.earn(d)); } load(); }
      if (a === "animals") { if (!Animals) throw 0; const k = T + "mama-gehege-2026"; const have = new Set(JSON.parse(localStorage.getItem(k) || "[]")); Animals.VARIANTS.filter((v) => !have.has(v.id)).slice(0, 10).forEach((v) => have.add(v.id)); localStorage.setItem(k, JSON.stringify([...have])); load(); }
      if (a === "buyall") { if (!Zoo) throw 0; const k = T + "mama-zoo-2026"; const z = JSON.parse(localStorage.getItem(k) || "{}"); z.owned = [...Zoo.ITEMS, ...Zoo.SMALL, ...Zoo.EXTRAS].map((i) => i[0]).filter((x) => x !== "feuerwerk" || cfg.date >= "2026-12-31"); localStorage.setItem(k, JSON.stringify(z)); load(); }
      if (a === "intro") { clearFirst(); load(); }
      if (a === "reset" && confirm("Den kompletten Testspielstand löschen?")) load(true);
    } catch (e) { alert("Das geht an diesem Tag nicht – vor dem 28.11. um 9 Uhr ist die Seite noch verschlossen."); }
  }));

  /* ---------- Anzeige & Steuerung ---------- */
  function render() {
    const dt = new Date(cfg.date + "T12:00");
    const sc = cfg.scene && SCENES.find((s) => s[0] === cfg.scene);
    $("now").textContent = (sc ? `${sc[1]} · ` : "") + dt.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" }) + ` ${cfg.time}`;
    document.querySelectorAll(".sc").forEach((b) => b.classList.toggle("on", b.dataset.id === cfg.scene));
    document.querySelectorAll(".day").forEach((b) => b.classList.toggle("on", !cfg.scene && b.dataset.d === cfg.date));
    document.querySelectorAll("#times .chip").forEach((b) => b.classList.toggle("on", !cfg.scene && b.dataset.t === cfg.time));
    document.querySelectorAll("#devices .chip").forEach((b) => b.classList.toggle("on", b.dataset.k === cfg.device));
    $("replay").style.display = cfg.scene ? "" : "none";
    size();
  }
  function size() {
    const [, w, h] = DEVICES[cfg.device];
    frame.style.width = w + "px"; frame.style.height = h + "px";
    device.classList.toggle("desk", cfg.device === "desk");
    const pw = cfg.device === "desk" ? 16 : 22, ph = cfg.device === "desk" ? 30 : 22;
    const sc = Math.min(1, (vp.clientWidth - 28) / (w + pw), (vp.clientHeight - 28) / (h + ph));
    device.style.transform = `scale(${sc})`;
    device.style.margin = `${(-(h + ph) * (1 - sc)) / 2}px ${(-(w + pw) * (1 - sc)) / 2}px`;
  }
  function step(n) {
    if (cfg.scene) { const i = SCENES.findIndex((s) => s[0] === cfg.scene); const nx = SCENES[Math.max(0, Math.min(SCENES.length - 1, i + n))]; playScene(nx[0]); return; }
    const d = new Date(cfg.date + "T12:00"); d.setDate(d.getDate() + n); cfg.date = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; load();
  }
  function onKey(e) {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    if (e.key === "r" || e.key === "R") { cfg.scene ? playScene(cfg.scene) : load(); }
  }
  document.addEventListener("keydown", onKey);
  $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
  $("replay").onclick = () => cfg.scene && playScene(cfg.scene);
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.id === "p-" + t.dataset.p));
    if (t.dataset.p === "state") stats();
  });
  Object.entries(DEVICES).forEach(([k, [n]]) => { const b = document.createElement("button"); b.className = "chip"; b.dataset.k = k; b.textContent = n; b.onclick = () => { cfg.device = k; store(); render(); }; $("devices").append(b); });
  addEventListener("resize", size);

  buildScenes(); buildDays();
  if (cfg.scene) playScene(cfg.scene); else load();
})();
</script>
</body>
</html>
