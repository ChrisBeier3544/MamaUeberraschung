<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mamas tierischer Adventskalender</title>
  <meta name="theme-color" content="#ffe9d6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="snow" aria-hidden="true"></div>

  <!-- Lichterkette -->
  <div id="lights" aria-hidden="true"></div>

  <header>
    <h1 id="title" aria-label="Mamas tierischer Adventskalender"></h1>
    <p class="subtitle">Hilf den Tieren, ihr Gehege in ein Winterparadies zu verwandeln <span id="title-heart">💖</span></p>
    <div id="countdown"></div>
  </header>

  <main>
    <section id="zoo" aria-label="Das Gehege">
      <div class="zoo-bar">
        <div class="coins"><span id="coin-icon"></span><b id="coin-count">0</b><span>Taler</span></div>
        <div class="zoo-progress" id="zoo-progress"></div>
        <button id="hunger-pill" class="hunger-pill hidden"></button>
        <button id="games-btn" class="btn btn-green">Spiele</button>
        <button id="shop-btn" class="btn">Shop</button>
      </div>
      <div id="zoo-pen" class="pen inline"></div>
    </section>

    <section id="today" aria-label="Heute im Gehege"></section>

    <section id="calendar" aria-label="Adventskalender"></section>

    <section id="bonus" class="hidden" aria-label="Bonus-Türchen">
      <h2 class="bonus-title">Die sieben Päckchen aus dem Paket</h2>
      <p class="bonus-sub">Die Geschichte geht weiter – bis Silvester.</p>
      <div id="calendar-bonus"></div>
    </section>
  </main>

  <!-- Kapibara-Maskottchen -->
  <div id="capy-wrap">
    <div id="capy-bubble" class="bubble">Hallo Mama! 🍊</div>
    <svg id="capy" viewBox="0 0 220 160" aria-label="Kalle das Kapibara" role="img">
      <ellipse cx="120" cy="152" rx="92" ry="7" fill="rgba(80,40,10,.15)"/>
      <rect x="62" y="118" width="22" height="32" rx="10" fill="#7d4f33"/>
      <rect x="160" y="118" width="22" height="32" rx="10" fill="#7d4f33"/>
      <ellipse cx="128" cy="98" rx="86" ry="50" fill="#a8714a"/>
      <ellipse cx="150" cy="80" rx="40" ry="18" fill="#b8835b" opacity=".6"/>
      <rect x="98" y="122" width="22" height="28" rx="10" fill="#8a5a3b"/>
      <rect x="190" y="116" width="20" height="30" rx="10" fill="#8a5a3b"/>
      <g id="capy-head">
        <rect x="8" y="44" width="100" height="72" rx="34" fill="#b37c54"/>
        <ellipse cx="84" cy="46" rx="11" ry="9" fill="#7d4f33"/>
        <ellipse cx="84" cy="47" rx="6" ry="5" fill="#d99b7a"/>
        <g id="capy-eyes">
          <ellipse class="capy-eye" cx="64" cy="70" rx="5.5" ry="6.5" fill="#2b1a10"/>
          <circle cx="66" cy="68" r="1.8" fill="#fff"/>
        </g>
        <ellipse cx="50" cy="94" rx="10" ry="6" fill="#ff8fa3" opacity=".55"/>
        <ellipse cx="20" cy="78" rx="9" ry="7" fill="#6b4029"/>
        <ellipse cx="17" cy="76" rx="2" ry="2.6" fill="#2b1a10"/>
        <ellipse cx="24" cy="76" rx="2" ry="2.6" fill="#2b1a10"/>
        <path d="M14 92 q8 6 18 0" stroke="#2b1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <g id="capy-orange">
        <circle cx="60" cy="32" r="15" fill="#ff9f1c"/>
        <circle cx="55" cy="27" r="4" fill="#ffc46b"/>
        <path d="M60 17 q8 -8 14 -2 q-8 4 -14 2z" fill="#4caf50"/>
      </g>
    </svg>
  </div>

  <!-- Tierparade -->
  <div id="parade"></div>

  <button id="sound-toggle" title="Ton an/aus">🔔</button>

  <!-- Rätsel-Fenster -->
  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" aria-label="Schließen">✖</button>
      <div class="modal-head">
        <div class="modal-art"></div>
        <div>
          <div class="modal-day"></div>
          <h2 class="modal-title"></h2>
        </div>
      </div>
      <div class="modal-story hidden"></div>
      <p class="modal-intro"></p>
      <div class="modal-body"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="fx" aria-hidden="true"></div>

  <script src="app.js"></script>
  <script src="texts.js"></script>
  <script src="zoo.js"></script>
  <script src="animals.js"></script>
  <script src="photos.js"></script>
  <script src="games.js"></script>
  <script src="extras.js"></script>
  <script src="puzzles.js"></script>
  <script>App.start();</script>
</body>
</html>
